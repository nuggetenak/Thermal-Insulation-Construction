name: CI

on:
  pull_request:
  push:
    branches: [dev]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Ids, content schema, cross-references, terminology, safety sourcing, the
      # guardrail tests themselves, then typecheck and build. Anything that
      # fails here never reaches main.
      - run: npm run check
